[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.1.0"
description = "Risk and conformance lab for agent-initiated payments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.7.2", "fastapi>=0.110", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["agentproof"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
